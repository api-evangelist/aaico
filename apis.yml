aid: aaico
name: AppliedAI (AAICO)
description: >-
  AppliedAI — The Applied AI Company, or AAICO — is an Abu Dhabi headquartered company, founded in
  2021, that builds AI-native workflow systems for heavily regulated industries: banking, fintech,
  insurance, healthcare, life sciences and government. Its platform, Opus, lets organizations
  discover an existing business process, build it as an auditable workflow of AI agents and human
  review steps, run it, and optimize it — automating document-heavy back-office and mid-office
  operations while keeping governance, audit trails and human oversight intact. Opus is built on a
  proprietary Large Work Model and Work Knowledge Graph that encode procedural knowledge. The
  company publishes a developer hub at developer.opus.com with a REST platform API for generating
  workflows, running them as cases, uploading files, reading discovered processes and authoring
  custom integrations, plus a remote MCP server over its documentation, an A2A agent card and a
  published Agent Skill. AAICO raised a $55M Series A led by G42 with Palantir, Bessemer Venture
  Partners, McKinsey, e& and Accrete Capital participating.
