apis:
- aid: aaico:opus-platform-api
  name: Opus Platform API
  description: >-
    The Opus REST API. Generate a workflow from a natural-language prompt, run a workflow as a
    "case" with populated inputs, upload files as case inputs through a presigned-URL flow, poll or
    receive a callback on case status, retrieve case results and a per-node audit log, read a
    discovered business process, and author custom integrations, providers and credentials for an
    organization. Execution is asynchronous; authentication is a static x-service-key header.
  humanURL: https://developer.opus.com/api-reference/introduction
  baseURL: https://operator.opus.com/api/v1
