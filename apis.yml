- aid: aaico:opus-docs-mcp
  name: Opus Docs MCP Server
  description: >-
    A first-party remote MCP server over the Opus developer documentation, reachable anonymously at
    https://developer.opus.com/mcp over streamable HTTP. Three tools: semantic search across the
    docs, a read-only virtual-filesystem query for exact/regex matching and full-page reads, and
    docs feedback submission. Read-only with respect to the Opus platform — it cannot run a
    workflow or reach a customer account.
  humanURL: https://developer.opus.com/mcp-setup
  baseURL: https://developer.opus.com/mcp
