domain_standard:
  applicable: false
  note: >-
    Reward-only check, deliberately left unclaimed. AI-native business-process orchestration has no
    settled interchange standard for the contract itself (nothing analogous to SCIM, FHIR, OpenRTB,
    OData or ISO 20022 applies to "run this workflow"). AAICO's domain-relevant credential is a
    management-system certification, ISO/IEC 42001, recorded above as a certification rather than
    as a contract-declared domain standard — the Opus API declares no domain schema, URN or
    message type in its own contract.
gaps:
- No OpenAPI, so the contract cannot be validated, linted, mocked or code-generated.
- No RFC 9457, no OAuth/OIDC, no idempotency, no rate-limit headers.
- Certification claims are marketing-page assertions; the attesting documents behind the Vanta trust center are access-gated.
