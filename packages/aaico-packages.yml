method: searched
source: >-
  Registry searches against registry.npmjs.org, pypi.org, plus the Opus developer hub SDK section
  and llms.txt index.
official_package_count: 0
sdk_count: 0
note: >-
  AAICO publishes NO installable client SDK for the Opus platform API on any public registry. The
  only thing the docs call an "SDK" is a runtime-injected, in-platform Python object — see
  in_platform_sdk below — which is not distributed and cannot be installed. Integrators call the
  REST API directly; the docs give raw cURL, Python `requests` and JavaScript `fetch` examples for
  every endpoint rather than SDK calls. A Postman collection is the only packaged client artifact,
  and it is distributed as a Google Drive download rather than through a Postman public workspace.
packages: []
in_platform_sdk:
  name: Opus SDK
  language: Python
  registry: none
  installable: false
  version: null
  published: null
  docs: https://developer.opus.com/opus-sdk/overview
  description: >-
    Inside an Opus Code task the identifier `Opus` is already defined; `Opus.file` provides
    download, presigned_download, create and upload against Opus file storage, returning OpusFile
    objects. It exists only in the platform's own Python execution sandbox.
  note: >-
    version and published are null because there is nothing to version: this SDK has no registry,
    no package name and no release feed. Checked, nothing to record — not "not checked". Its
    surface moves with the platform release line (currently 2.6) and is not independently
    versioned. Third-party Python packages usable inside Opus Code are listed at
    https://developer.opus.com/opus-sdk/available-packages.
