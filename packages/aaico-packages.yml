other_client_artifacts:
- name: Opus Job Operator Postman Collection
  kind: postman-collection
  official: true
  registry: cdn
  distribution: Google Drive download link
  url: https://developer.opus.com/api-reference/v0-jobs/postman-collection
  download: https://drive.google.com/open?id=1BMG05fHj33rH3vgw2N9Ma1yoYDogL8va
  version: null
  published: null
  version_note: >-
    Unversioned and undated. The collection is a Drive file behind a share link with no manifest,
    no release feed and no version marker, so a consumer cannot tell which API revision it targets
