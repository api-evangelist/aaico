billing_model:
  unit: Manhour
  description: >-
    Opus meters usage in "Manhours", its unit for the work a job performs. No price per Manhour is
    published; the allocation is set per organization under a commercial agreement.
  charged_when: a job completes successfully
  not_charged_when: [created, queued, running, failed]
  also_consumes_manhours:
  - running previews in the Builder
  - Prompt to Workflow generation
  - Opus AI Assist edits
  estimates: >-
    An estimate is shown before a run and is always worst-case; on a branching workflow the
    estimate prices the most expensive path while the actual charge follows the path that ran.
  usage_reporting: Organization settings -> Plan & Usage -> Usage (timestamp, workflow, workspace, Manhours, remaining balance, actor)
  source: https://developer.opus.com/guides/manhours
