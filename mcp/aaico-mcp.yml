company: AppliedAI (AAICO)
description: 'A first-party, publicly reachable MCP server over the Opus developer documentation. It is
  a READ-ONLY documentation surface: it searches and reads published docs pages and lets a client file
  docs feedback. It does NOT reach the Opus platform API, a workflow, or a customer account.'
note: AAICO's developer surface is published under the Opus product brand; www.aaico.com links straight
  to developer.opus.com, which is why an opus.com host is accepted as this company's own.
